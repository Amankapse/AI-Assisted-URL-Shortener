<section class="error" role="alert">
  <h2>{{ problem().title || 'Request failed' }}</h2>
  @if (problem().detail) {
    <p>{{ problem().detail }}</p>
  }
  @if (problem().correlationId) {
    <small>Correlation ID: {{ problem().correlationId }}</small>
  }
  <button type="button" (click)="retry.emit()">Retry</button>
</section>
