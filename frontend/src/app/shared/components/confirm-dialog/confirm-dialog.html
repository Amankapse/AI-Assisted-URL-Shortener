@if (open()) {
  <div class="backdrop" role="presentation" (click)="cancelled.emit()"></div>
  <section class="dialog" role="dialog" aria-modal="true" [attr.aria-label]="title()" (keydown)="onKeydown($event)">
    <h2>{{ title() }}</h2>
    <p>{{ description() }}</p>
    <div class="actions">
      <button #cancelButton type="button" class="secondary" (click)="cancelled.emit()">{{ cancelLabel() }}</button>
      <button type="button" class="danger" (click)="confirmed.emit()">{{ confirmLabel() }}</button>
    </div>
  </section>
}
