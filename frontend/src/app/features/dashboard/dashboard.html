<section class="dashboard">
  <div>
    <p class="eyebrow">Workspace</p>
    <h1>URL management foundation</h1>
  </div>

  @if (workspaceState.loading()) {
    <app-loading-state label="Loading workspace context..." />
  } @else if (workspaceState.selectedWorkspace(); as workspace) {
    <article class="summary">
      <span>Selected workspace</span>
      <strong>{{ workspace.name }}</strong>
      <small>{{ workspace.role }}</small>
    </article>
  } @else {
    <p class="empty">No workspace is available for this account.</p>
  }
</section>
