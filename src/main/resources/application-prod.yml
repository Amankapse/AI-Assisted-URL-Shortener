server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:900000}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL}

management:
  health:
    redis:
      enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  public-base-url: ${APP_PUBLIC_BASE_URL}
  auth:
    issuer: ${APP_AUTH_ISSUER}
    audience: ${APP_AUTH_AUDIENCE}
    key-id: ${APP_AUTH_KEY_ID}
    private-key-pem: ${APP_AUTH_PRIVATE_KEY_PEM}
    public-key-pem: ${APP_AUTH_PUBLIC_KEY_PEM}
    allowed-origins: ${APP_AUTH_ALLOWED_ORIGINS}
    secure-cookies: ${APP_AUTH_SECURE_COOKIES:true}
  analytics:
    publisher: ${APP_ANALYTICS_PUBLISHER:local}
    ip-hash-pepper: ${APP_ANALYTICS_IP_HASH_PEPPER}
  audit:
    metadata-max-bytes: ${APP_AUDIT_METADATA_MAX_BYTES:4096}
    retention: ${APP_AUDIT_RETENTION:3650d}
  api-key:
    hash-pepper: ${APP_API_KEY_HASH_PEPPER}
    default-expiry: ${APP_API_KEY_DEFAULT_EXPIRY:90d}
    max-expiry: ${APP_API_KEY_MAX_EXPIRY:365d}
    last-used-update-interval: ${APP_API_KEY_LAST_USED_UPDATE_INTERVAL:15m}
    max-header-length: ${APP_API_KEY_MAX_HEADER_LENGTH:256}
  outbox:
    enabled: ${APP_OUTBOX_ENABLED:true}
    batch-size: ${APP_OUTBOX_BATCH_SIZE:25}
    poll-interval: ${APP_OUTBOX_POLL_INTERVAL:1s}
    workers: ${APP_OUTBOX_WORKERS:1}
    max-attempts: ${APP_OUTBOX_MAX_ATTEMPTS:5}
    base-backoff: ${APP_OUTBOX_BASE_BACKOFF:1s}
    max-backoff: ${APP_OUTBOX_MAX_BACKOFF:1m}
    claim-timeout: ${APP_OUTBOX_CLAIM_TIMEOUT:5m}
    retention: ${APP_OUTBOX_RETENTION:7d}
    cleanup-interval: ${APP_OUTBOX_CLEANUP_INTERVAL:1h}
    cleanup-batch-size: ${APP_OUTBOX_CLEANUP_BATCH_SIZE:500}
    max-payload-bytes: ${APP_OUTBOX_MAX_PAYLOAD_BYTES:8192}
    shutdown-grace-period: ${APP_OUTBOX_SHUTDOWN_GRACE_PERIOD:10s}
    metrics-refresh-interval: ${APP_OUTBOX_METRICS_REFRESH_INTERVAL:30s}
  rate-limit:
    key-salt: ${APP_RATE_LIMIT_KEY_SALT}
    policies:
      api-key:
        limit: ${APP_RATE_LIMIT_API_KEY_REQUESTS:600}
        window: ${APP_RATE_LIMIT_API_KEY_WINDOW:1m}
        fail-open: false
