spring:
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:postgresql:15-alpine:///shortener
    username: shortener
    password: shortener
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
app:
  auth:
    secure-cookies: false
  analytics:
    publisher: local
    ip-hash-pepper: test-analytics-pepper
  outbox:
    enabled: false
  redirect:
    cache:
      enabled: false
  rate-limit:
    enabled: true
    key-salt: test-rate-limit-salt
    policies:
      registration:
        limit: 1000
        window: 1m
        fail-open: true
      login:
        limit: 1000
        window: 1m
        fail-open: true
      refresh:
        limit: 1000
        window: 1m
        fail-open: true
      url-create:
        limit: 1000
        window: 1m
        fail-open: true
      redirect:
        limit: 1000
        window: 1m
        fail-open: true
      admin-analytics:
        limit: 1000
        window: 1m
        fail-open: true
      api-key:
        limit: 1000
        window: 1m
        fail-open: true
