name: CI

on:
  push:
    branches: [ main, master, "phase-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify Docker
        run: docker version

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build, test, and generate coverage
        run: ./mvnw clean verify

      - name: Validate Docker Compose
        run: docker compose config

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Audit frontend production-relevant dependency risk
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build combined Docker image
        run: docker build -t url-shortener-fullstack:ci .

      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Archive JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Archive frontend production build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
